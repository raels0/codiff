name: Azure DevOps desktop

on:
  push:
    branches: [feat/azure-devops-prs]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install native-keymap dependencies
        run: sudo apt-get update && sudo apt-get install --yes libx11-dev libxkbfile-dev
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: 24
          run-install: true
      - run: vp check --fix
      - run: vpr build
      - name: Test hosted review integration
        run: >-
          vp test run
          core/__tests__/azure-devops.test.ts
          core/__tests__/codiff-cli.test.ts
          electron/__tests__/review-source.test.ts
          electron/__tests__/command-line.test.ts
          core/__tests__/OpenReviewSourceDialog.test.tsx
          core/__tests__/OpenReviewSourceMenu.test.tsx
      - run: git diff --exit-code

  windows:
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      CODIFF_SKIP_SQUIRREL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: 24
          run-install: true
      - name: Test Windows Azure transport
        run: vp test run core/__tests__/azure-devops.test.ts electron/__tests__/review-source.test.ts
      - run: vp build
      - run: vp exec electron-forge make --platform=win32 --arch=x64
      - uses: actions/upload-artifact@v4
        with:
          name: Codiff-ADO-Windows
          path: out/make/zip/win32/x64/*.zip
          if-no-files-found: error
